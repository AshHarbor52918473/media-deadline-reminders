[project]
name = "media-deadline-reminders"
version = "0.1.0"
description = "Schedule typed reminders for media ingestion, processing, and creator delivery."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
